name: Capture README screenshots

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore web app
        run: dotnet restore ./src/IntelliCasePro.Web/IntelliCasePro.Web.csproj

      - name: Start IntelliCase Pro
        run: |
          dotnet run --project ./src/IntelliCasePro.Web/IntelliCasePro.Web.csproj --urls http://127.0.0.1:5050 > /tmp/intellicase.log 2>&1 &
          echo $! > /tmp/intellicase.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5050/Auth/Login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/intellicase.log
          exit 1

      - name: Install screenshot browser
        run: |
          mkdir -p /tmp/intellicase-screens
          cd /tmp/intellicase-screens
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture real application screens
        env:
          APP_URL: http://127.0.0.1:5050
        run: |
          mkdir -p docs/assets
          cat > /tmp/intellicase-screens/capture.cjs <<'EOF'
          const { chromium } = require('playwright');
          const path = require('node:path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1600, height: 1000 }, deviceScaleFactor: 1 });
            const base = process.env.APP_URL;
            const out = process.env.GITHUB_WORKSPACE;

            await page.goto(`${base}/Auth/Login`, { waitUntil: 'networkidle' });
            await page.locator('input[name="Email"]').fill('jane@intellicasepro.local');
            await page.locator('input[name="Password"]').fill('Demo#2026!');
            await Promise.all([
              page.waitForURL(url => !url.pathname.includes('/Auth/Login')),
              page.locator('button[type="submit"]').click()
            ]);
            await page.waitForLoadState('networkidle');

            await page.screenshot({ path: path.join(out, 'docs/assets/dashboard.png'), fullPage: false });

            await page.goto(`${base}/Cases`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: path.join(out, 'docs/assets/cases.png'), fullPage: false });

            const firstCase = page.locator('tr.clickable-row').first();
            if (await firstCase.count()) {
              await firstCase.click();
              await page.waitForLoadState('networkidle');
              await page.screenshot({ path: path.join(out, 'docs/assets/case-details.png'), fullPage: false });
            }

            await page.goto(`${base}/Evidence`, { waitUntil: 'networkidle' });
            await page.screenshot({ path: path.join(out, 'docs/assets/evidence.png'), fullPage: false });

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          EOF
          cd /tmp/intellicase-screens
          node capture.cjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/*.png
          if git diff --cached --quiet; then
            echo "Screenshots are already current."
            exit 0
          fi
          git commit -m "Add IntelliCase Pro application screenshots"
          git push
