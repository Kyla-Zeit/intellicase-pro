services:
  intellicasepro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intellicasepro
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/app/data/intellicasepro.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
